}
function shrink(pyr, w, h){
  let s = pyr[0];
  for (const c of pyr){ const [cw, ch] = sizeOf(c); if (cw >= w*2 && ch >= h*2) s = c; }
  const g = document.createElement("canvas").getContext("2d", { willReadFrequently:true });
  g.canvas.width = w; g.canvas.height = h; g.imageSmoothingQuality = "high"; g.drawImage(s, 0, 0, w, h);
  return g.getImageData(0, 0, w, h).data;
}
function lbPalette(pyr){                       // 原片的 5 个主色（k-means，按亮度分位数起步）
  const d = shrink(pyr, 48, 48), px = [];
  for (let i=0; i<d.length; i+=4) px.push([d[i], d[i+1], d[i+2]]);
  px.sort((a,b)=>lumOf(...a) - lumOf(...b));
  let C = [.08,.3,.5,.7,.92].map(q=>[...px[Math.floor(q*(px.length-1))]]), n = [];
  for (let it=0; it<10; it++){
    const s = C.map(()=>[0,0,0]); n = C.map(()=>0);
    for (const p of px){
      let bi = 0, bd = 1e9;
      C.forEach((c,j)=>{ const e = (c[0]-p[0])**2 + (c[1]-p[1])**2 + (c[2]-p[2])**2; if (e < bd){ bd = e; bi = j; } });
      s[bi][0] += p[0]; s[bi][1] += p[1]; s[bi][2] += p[2]; n[bi]++;
    }
    C = C.map((c,j)=>n[j] ? s[j].map(v=>v/n[j]) : c);
  }
  return C.map((c,j)=>({ rgb:c.map(Math.round), share:n[j]/px.length })).sort((a,b)=>b.share - a.share);
}
// 一张照片要用的东西：原图、像素（取色用）、金字塔、主色。按下鼠标时就开始准备，松手时多半已经好了
function lbItem(ci, i){
  const p = CHAPTERS[ci].photos[i];
  if (!LB_ITEMS.has(p.src)){
    LB_ITEMS.set(p.src, (async ()=>{
      const img = new Image(); img.src = photoURL("full", p.src); await img.decode();
      const W = img.naturalWidth, H = img.naturalHeight, g = document.createElement("canvas").getContext("2d", { willReadFrequently:true });
      g.canvas.width = W; g.canvas.height = H; g.drawImage(img, 0, 0);
      const pyr = pyramid(img);
      return { p, img, W, H, px:g.getImageData(0, 0, W, H).data, pyr, pal:lbPalette(pyr), styled:new Map() };
    })().catch(e=>{ LB_ITEMS.delete(p.src); throw e; }));
    if (LB_ITEMS.size > 8) LB_ITEMS.delete(LB_ITEMS.keys().next().value);
  }
  return LB_ITEMS.get(p.src);
}
function lbRect(it){
  const r = lbStage.getBoundingClientRect(), pad = innerWidth <= 700 ? 16 : 48;
  const k = Math.min((r.width - pad*2)/it.W, (r.height - pad*2)/it.H), w = it.W*k, h = it.H*k;
  return { x:r.left + (r.width - w)/2, y:r.top + (r.height - h)/2, w, h };
}
// 章节当前是什么风格，大图就显影成什么风格；原作保留的风格作品不处理
function lbSource(it, R){
  const id = curStyle();
  if (id==="orig" || it.p.credit) return { cv:it.img, pyr:it.pyr };
  const d = dprOf(), cap = Math.min(1, 1200/(Math.max(R.w, R.h)*d));
  const W = Math.round(R.w*d*cap), H = Math.round(R.h*d*cap), key = `${id}|${W}x${H}`;
  if (!it.styled.has(key)){ const cv = FX_FN[id](it.img, W, H).canvas; it.styled.clear(); it.styled.set(key, { cv, pyr:pyramid(cv) }); }
  return it.styled.get(key);
}
function lbLayout(){
  const d = dprOf(); lbCv.width = innerWidth*d; lbCv.height = innerHeight*d; lbG.setTransform(d, 0, 0, d, 0, 0);
  if (!LB.item) return;
  LB.rect = lbRect(LB.item); LB.src = lbSource(LB.item, LB.rect); LB.levels = [];
}

/* 点阵：每一级先画成一张离屏图，动画里只贴图，不逐点重画 */
function lbGrid(j){
  const R = LB.rect, s = LB_STEPS[j], cols = Math.max(2, Math.round(R.w/s)), rows = Math.max(2, Math.round(R.h/s));
  return { cols, rows, cw:R.w/cols, ch:R.h/rows, d:shrink(LB.src.pyr, cols, rows) };
}
function lbLevel(j){
  if (LB.levels[j]) return LB.levels[j];
  const d = dprOf(), R = LB.rect, G = lbGrid(j), c = document.createElement("canvas");
  c.width = Math.ceil(R.w*d); c.height = Math.ceil(R.h*d);
  const g = c.getContext("2d"), r = Math.min(G.cw, G.ch)*.5; g.scale(d, d);
  for (let y=0; y<G.rows; y++) for (let x=0; x<G.cols; x++){
    const o = (y*G.cols + x)*4; g.fillStyle = `rgb(${G.d[o]},${G.d[o+1]},${G.d[o+2]})`;
    g.beginPath(); g.arc((x+.5)*G.cw, (y+.5)*G.ch, r, 0, Math.PI*2); g.fill();
  }
  return LB.levels[j] = c;
}
function lbBakeAhead(){ for (let j=0; j<LB_STEPS.length; j++) if (!LB.levels[j]){ lbLevel(j); return; } }   // 每帧最多预画一级，不卡
// k：0 是最粗的点阵，1 是照片。相邻两级交叉淡入，点是连续变细的，不是一级一级跳
function lbDrawDev(k){
  const n = LB_STEPS.length, pos = clamp01(k)*n, R = LB.rect;
  lbG.clearRect(0, 0, innerWidth, innerHeight);
  if (pos < n-1){
    const a = Math.floor(pos), f = easeSine(pos - a);
    lbG.globalAlpha = 1 - f; lbG.drawImage(lbLevel(a), R.x, R.y, R.w, R.h);
    lbG.globalAlpha = Math.min(1, f*1.6); lbG.drawImage(lbLevel(a+1), R.x, R.y, R.w, R.h);
  } else {
    lbG.drawImage(lbLevel(n-1), R.x, R.y, R.w, R.h);
    lbG.globalAlpha = easeSine(pos - (n-1)); lbG.drawImage(LB.src.cv, R.x, R.y, R.w, R.h);
  }
  lbG.globalAlpha = 1;
}
function lbThumb(){                            // 缩略图此刻在屏幕上的位置（章节页有视差，它会动）
  const pic = CH.figs[LB.i]?.el.querySelector(".pic");
  if (pic) return pic.getBoundingClientRect();
  return { left:innerWidth/2 - 30, top:innerHeight/2 - 30, width:60, height:60 };
}
function lbDots(){                             // 聚拢用的粒子：最粗那一级点阵的每个点，都记住它在缩略图里的相对位置
  const R = LB.rect, G = lbGrid(0), dots = [];
  for (let y=0; y<G.rows; y++) for (let x=0; x<G.cols; x++){
    const o = (y*G.cols + x)*4, u = (x+.5)/G.cols, v = (y+.5)/G.rows;
    dots.push({ u:u + (Math.random()-.5)*.2, v:v + (Math.random()-.5)*.2, ex:R.x + u*R.w, ey:R.y + v*R.h,
      c:[G.d[o], G.d[o+1], G.d[o+2]], r:Math.min(G.cw, G.ch)*.5, bend:(Math.random()-.5)*.7,
      delay:Math.hypot(u-.5, v-.5)/.71*.75 + Math.random()*.25 });   // 离中心越远越晚出发
  }
  LB.dots = dots;
}
function lbDrawDots(t, back){
  const T = lbThumb(), D = .34;
  lbG.clearRect(0, 0, innerWidth, innerHeight);
  for (const d of LB.dots){
    const lt = clamp01((t - d.delay*D)/(1 - D));
    const e = back ? 1 - easeIO(lt) : easeBack(lt);
    const sx = T.left + d.u*T.width, sy = T.top + d.v*T.height;
    // 二次贝塞尔：控制点偏到连线一侧，每个点走一条略弯的路
    const mx = (sx + d.ex)/2 + (d.ey - sy)*d.bend*.5, my = (sy + d.ey)/2 - (d.ex - sx)*d.bend*.5;
    const q = 1 - e, x = q*q*sx + 2*q*e*mx + e*e*d.ex, y = q*q*sy + 2*q*e*my + e*e*d.ey;
    const tint = back ? 1 : clamp01(lt*1.6 - .1), a = back ? clamp01((1 - lt)*3) : clamp01(lt*5);
    if (a <= 0) continue;
    const r = d.r*(.3 + .7*clamp01(e));
    lbG.globalAlpha = a;
    lbG.fillStyle = `rgb(${ACCENT[0] + (d.c[0]-ACCENT[0])*tint|0},${ACCENT[1] + (d.c[1]-ACCENT[1])*tint|0},${ACCENT[2] + (d.c[2]-ACCENT[2])*tint|0})`;
    lbG.beginPath(); lbG.arc(x, y, r, 0, Math.PI*2); lbG.fill();
  }
  lbG.globalAlpha = 1;
}
// 一段补间动画；新动画开始或大图被重置时，旧的自动作废（返回 false）
function tween(dur, draw){
  const tok = ++lbTok;
  return new Promise(res=>{
    const t0 = performance.now();
    const f = now=>{
      if (tok!==lbTok) return res(false);
      const t = Math.min(1, (now - t0)/dur); draw(t);
      t < 1 ? requestAnimationFrame(f) : res(true);
    };
    requestAnimationFrame(f);
  });
}
function lbDevelop(k0, k1, dur){
  const n = LB_STEPS.length;
  return tween(dur, t=>{
    const k = LB.k = k0 + (k1 - k0)*easeSine(t);
    lbDrawDev(k); lbBakeAhead();
    const s = Math.floor(k*n);
    if (k1 > k0 && s > LB.step && s < n){ LB.step = s; lbSnd("step", s); }   // 显影每细一级响一个音
  });
}

/* ---------------- 打开、切换、换风格、关闭 ---------------- */
function lbFillText(){
  const ch = CHAPTERS[LB.ci], p = ch.photos[LB.i], st = STYLES.find(s=>s.id===curStyle());
  $("#lbCh").innerHTML = `CH.${pad2(LB.ci+1)} — ${ch.en}<span>${ch.zh}</span>`;
  $("#lbNo").innerHTML = `${pad2(LB.i+1)}<span> / ${pad2(ch.photos.length)}</span>`;
  $("#lbCap").textContent = p.cap;
  $("#lbMode").innerHTML = p.credit ? `Original work<span>原作保留，不做风格处理</span>`
    : st.id==="orig" ? `Original<span>原图</span>` : `${st.en}<span>${st.zh} · 放大镜里看原片</span>`;
  const cr = $("#lbCred"), [work, by] = (p.credit || "").split(" · ");
  cr.hidden = !p.credit;
  cr.innerHTML = p.credit ? `<em class="x">Style work · 风格作品</em>${work}<br>by ${by}${p.license ? `<br>${p.license}` : ""}` : "";
}
function lbFillData(){
  $("#lbPal").innerHTML = LB.item.pal.map(c=>{ const h = hexOf(c.rgb);
    return `<button type="button" data-hex="${h}" title="复制色号"><i style="background:${h}"></i><b>${h}</b><span>${Math.round(c.share*100)}%</span></button>`; }).join("");
  lbReadout(null);
}
function lbFail(){
  $("#chLine").textContent = "大图需要用本地服务器打开这个网页（直接双击 html 时浏览器不让读取照片像素）";
  history.replaceState(null, "", `#/ch/${LB.ci+1}`); lbReset();
}
async function lbOpen(ci, i, pushed){
  if (LB.open) return;
  Object.assign(LB, { open:true, closing:false, busy:true, ci, i, pushed, phase:"open", step:-1, k:0 });
  lb.classList.add("open"); lb.setAttribute("aria-hidden", "false"); lbStage.style.cursor = "";
  lbFillText();
  let it; try { it = await lbItem(ci, i); } catch(e){ lbFail(); return; }
  if (!LB.open || LB.closing) return;
  LB.item = it; lbLayout(); lbFillData();
  sndDuck(true); lbSnd("open");
  $("#lbClose").focus({ preventScroll:true });
  if (!reduce){ lbDots(); if (!await tween(THEME.motion.gather, t=>{ lbDrawDots(t, false); lbBakeAhead(); })) return; }
  if (!await lbDevelop(0, 1, reduce ? 1 : THEME.motion.develop)) return;
  lbShown();
}
function lbShown(){ LB.busy = false; LB.phase = "shown"; LB.k = 1; lbDrawDev(1); lbSnd("done"); }
async function lbSwitch(d){
  if (!LB.open || LB.busy || LB.closing) return;
  const n = CHAPTERS[LB.ci].photos.length, i = mod(LB.i + d, n), next = lbItem(LB.ci, i);
  next.catch(()=>{});
  LB.busy = true; LB.phase = "swap"; lpHide(); lbSnd("swap");
  history.replaceState(null, "", `#/ch/${LB.ci+1}/${i+1}/view`);   // 换张不进浏览器历史，返回键直接关掉大图
  if (!await lbDevelop(LB.k, 0, reduce ? 1 : 420)) return;
  let it; try { it = await next; } catch(e){ lbFail(); return; }
  if (!LB.open || LB.closing) return;
  LB.i = i; LB.item = it; LB.step = -1; lbLayout(); lbFillText(); lbFillData();
  if (!await lbDevelop(0, 1, reduce ? 1 : 1000)) return;
  lbShown();
}
async function lbRestyle(id){                  // 大图里按 1–4：章节背后一起换，大图退回半粗点阵再显影成新风格
  setStyle(id, true);
  if (!LB.open || LB.busy || LB.closing || !LB.item) return;
  lbFillText();
  if (LB.item.p.credit) return;
  LB.busy = true; LB.phase = "swap"; lpHide(); lbSnd("swap");
  if (!await lbDevelop(1, .45, reduce ? 1 : 380)) return;
  LB.src = lbSource(LB.item, LB.rect); LB.levels = []; LB.step = Math.floor(.45*LB_STEPS.length);
  if (!await lbDevelop(.45, 1, reduce ? 1 : 700)) return;
  lbShown();
}
// 从章节页点开的大图，关闭时走浏览器的返回，历史记录保持干净；直接打开链接进来的，就原地改网址
function lbRequestClose(){
  if (!LB.open || LB.closing) return;
  if (LB.pushed) history.back();
  else { history.replaceState(null, "", `#/ch/${LB.ci+1}`); lbClose(); }
}
async function lbClose(){
  if (!LB.open || LB.closing) return;
  LB.closing = true; LB.busy = true; LB.phase = "close"; lpHide();
  LB.refocus = lb.contains(document.activeElement);            // 侧栏收起后焦点会丢，先记下来
  sndDuck(false); lbSnd("close");
  const f = CH.figs[LB.i]; if (f) CH.tx = Math.max(0, Math.min(CH.max, f.c - chV.clientWidth/2));   // 章节页滚到这张，点才飞得回去
  if (LB.item && LB.rect && !reduce){
    if (!await lbDevelop(LB.k, 0, 450)) return;
    lbDots(); lb.classList.remove("open");
    if (!await tween(750, t=>lbDrawDots(t, true))) return;
  }
  lbReset();
}
function lbReset(){
  lbTok++; sndDuck(false);
  const back = LB.refocus || lb.contains(document.activeElement); LB.refocus = false;
  Object.assign(LB, { open:false, closing:false, busy:false, phase:"idle", item:null, rect:null, src:null, levels:[], dots:[] });
  lb.classList.remove("open"); lb.setAttribute("aria-hidden", "true"); lpHide();
  lbG.clearRect(0, 0, innerWidth, innerHeight);
  if (back) CH.figs[LB.i]?.el.querySelector(".pic")?.focus({ preventScroll:true });
}
function lbSync(r){                            // 同一章里网址变了：只开关、切换大图
  if (r.photo < 0){ if (LB.open) lbClose(); return; }
  if (!LB.open){ const pushed = LB.pushNext; LB.pushNext = false; lbOpen(r.ci, r.photo, pushed); }
  else if (r.photo!==LB.i) lbSwitch(r.photo - LB.i);
}
function lbFromPic(pic){
  if (LB.open) return;
  const i = [...chT.children].indexOf(pic.closest(".fig")); if (i < 0) return;
  LB.pushNext = true; location.hash = `#/ch/${route.ci+1}/${i+1}/view`;
}

/* ---------------- 放大镜：跟手带一点惯性；放大超过原图像素时直接显示像素格 ---------------- */
const LP = { on:false, x:0, y:0, tx:0, ty:0, z:3, tz:3, touch:false, raf:0, deg:-1, at:0, hex:"" };
function lpInside(cx, cy){ const R = LB.rect; return !!R && cx>=R.x && cx<=R.x+R.w && cy>=R.y && cy<=R.y+R.h; }
function lpSample(nx, ny){                     // 3×3 取平均，避免取到单个噪点
  const { px, W, H } = LB.item, c = [0,0,0];
  for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){
    const x = Math.min(W-1, Math.max(0, Math.round(nx)+dx)), y = Math.min(H-1, Math.max(0, Math.round(ny)+dy)), o = (y*W + x)*4;
    c[0] += px[o]; c[1] += px[o+1]; c[2] += px[o+2];
  }
  return c.map(v=>Math.round(v/9));
}
function lpMove(cx, cy, touch){
  if (LB.phase!=="shown") return;
  const R = LB.rect;
  if (touch){ cx = Math.min(R.x + R.w, Math.max(R.x, cx)); cy = Math.min(R.y + R.h, Math.max(R.y, cy)); }
  const inside = lpInside(cx, cy);
  lbStage.style.cursor = inside ? "none" : "zoom-out";
  if (!inside){ lpHide(); lbReadout(null); return; }
  LP.tx = cx; LP.ty = cy; LP.touch = touch;
  if (!LP.on){ LP.on = true; LP.x = cx; LP.y = cy; loupe.classList.add("on"); }
  lpKick(); lpListen(cx, cy);
}
function lpHide(){ LP.on = false; loupe.classList.remove("on"); }
function lpKick(){ if (!LP.raf) LP.raf = requestAnimationFrame(lpFrame); }
function lpFrame(){
  LP.raf = 0; if (!LP.on || !LB.item) return;
  LP.x += (LP.tx - LP.x)*.35; LP.y += (LP.ty - LP.y)*.35; LP.z += (LP.tz - LP.z)*.25;
  lpDraw();
  if (Math.abs(LP.tx - LP.x) + Math.abs(LP.ty - LP.y) > .2 || Math.abs(LP.tz - LP.z) > .005) lpKick();
}
function lpDraw(){
  const R = LB.rect, it = LB.item, L = innerWidth <= 700 ? 150 : 210, d = dprOf(), S = lbStage.getBoundingClientRect();
  if (LP.L !== L || lpCv.width !== L*d){ LP.L = L; lpCv.width = lpCv.height = L*d; loupe.style.setProperty("--L", L + "px"); }
  // 显示位置：手指操作时放在手指上方；靠边时收进来。取样点始终是指针所在处
  const px = Math.min(S.right - L/2 - 10, Math.max(S.left + L/2 + 10, LP.x));
  const py = Math.min(S.bottom - L/2 - 40, Math.max(S.top + L/2 + 10, LP.y - (LP.touch ? L*.85 : 0)));
  loupe.style.transform = `translate3d(${px - L/2}px,${py - L/2}px,0)`;
  const nx = (LP.x - R.x)/R.w*it.W, ny = (LP.y - R.y)/R.h*it.H;
  const per = LP.z*R.w/it.W, span = L/per, x0 = nx - span/2, y0 = ny - span/2;   // per：原图一个像素放大后占几个点
  lpG.fillStyle = `rgb(${PAPER})`; lpG.fillRect(0, 0, lpCv.width, lpCv.height);
  lpG.imageSmoothingEnabled = per < 2.5; lpG.imageSmoothingQuality = "high";
  lpG.drawImage(it.img, x0, y0, span, span, 0, 0, lpCv.width, lpCv.height);   // 放大镜里永远是原片
  if (per >= 4){
    const s = per*d; lpG.strokeStyle = `rgba(${PAPER},.14)`; lpG.lineWidth = 1; lpG.beginPath();
    for (let g = Math.ceil(x0); g < x0 + span; g++){ const X = Math.round((g - x0)*s) + .5; lpG.moveTo(X, 0); lpG.lineTo(X, lpCv.height); }
    for (let g = Math.ceil(y0); g < y0 + span; g++){ const Y = Math.round((g - y0)*s) + .5; lpG.moveTo(0, Y); lpG.lineTo(lpCv.width, Y); }
    lpG.stroke();
  }
  $("#lpZ").textContent = "×" + Math.round(LP.tz*10)/10 + (per >= 2.5 ? " · PX" : "");
  lbReadout(lpSample(nx, ny), nx, ny);
}
function lbReadout(rgb, nx, ny){
  const el = $("#lbRead");
  if (!rgb){
    LP.hex = ""; el.classList.add("empty"); el.style.background = el.style.color = "";
    $("#lbHex").textContent = innerWidth <= 700 ? "按住照片拖动看细节" : "把鼠标移到照片上";
    $("#lbRgb").textContent = $("#lbXY").textContent = ""; return;
  }
  $("#lbXY").textContent = `X ${nx|0} · Y ${ny|0}`;
  const h = hexOf(rgb); if (h===LP.hex) return; LP.hex = h;
  el.classList.remove("empty"); el.style.background = h; el.style.color = `rgb(${lumOf(...rgb) > .6 ? INK : PAPER})`;
  $("#lbHex").textContent = $("#lpHex").textContent = h; $("#lbRgb").textContent = `R${rgb[0]} G${rgb[1]} B${rgb[2]}`;
  $("#lpSw").style.background = h;
}
// 听照片：指针下的亮度换成都节音阶里的一个音，越亮越高，颜色越艳越响；只在换到新音时响
function lpListen(cx, cy){
  if (!sndReady()) return;
  const now = performance.now(); if (now - LP.at < 110) return;
  const R = LB.rect, it = LB.item, c = lpSample((cx - R.x)/R.w*it.W, (cy - R.y)/R.h*it.H);
  const deg = Math.round(lumOf(...c)*9); if (deg===LP.deg) return;
  LP.deg = deg; LP.at = now;
  lbSnd("look", deg, .45 + (Math.max(...c) - Math.min(...c))/255*.55);
}

lbStage.addEventListener("pointermove", e=>{ if (e.pointerType==="mouse" || e.buttons) lpMove(e.clientX, e.clientY, e.pointerType!=="mouse"); });
lbStage.addEventListener("pointerdown", e=>{
  if (LB.phase!=="shown") return;
  if (!lpInside(e.clientX, e.clientY)) return lbRequestClose();          // 点照片外的空白处关闭
  if (e.pointerType!=="mouse"){ try { lbStage.setPointerCapture(e.pointerId); } catch(err){} lpMove(e.clientX, e.clientY, true); }
});
lbStage.addEventListener("pointerup", e=>{ if (e.pointerType!=="mouse") lpHide(); });
lbStage.addEventListener("pointerleave", e=>{ if (e.pointerType==="mouse"){ lpHide(); lbReadout(null); } });
lbStage.addEventListener("wheel", e=>{
  e.preventDefault(); if (LB.phase!=="shown") return;
  const zMax = Math.max(10, 8*LB.item.W/LB.rect.w);              // 最大倍数：总能放到原图一个像素占 8 个点
  LP.tz = Math.max(1.5, Math.min(zMax, LP.tz*(e.deltaY < 0 ? 1.15 : 1/1.15)));
  lpMove(e.clientX, e.clientY, false);
}, { passive:false });
$("#lbClose").addEventListener("click", lbRequestClose);
$("#lbPrev").addEventListener("click", ()=>lbSwitch(-1));
$("#lbNext").addEventListener("click", ()=>lbSwitch(1));
$("#lbPal").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  navigator.clipboard?.writeText(b.dataset.hex).then(()=>{ const t = b.querySelector("span"), o = t.textContent; t.textContent = "已复制"; setTimeout(()=>t.textContent = o, 900); }).catch(()=>{});
});
addEventListener("keydown", e=>{
  if (!LB.open) return;
  if (e.key==="Escape") lbRequestClose();
  else if (e.key==="ArrowRight" || e.key==="ArrowDown") lbSwitch(1);
  else if (e.key==="ArrowLeft" || e.key==="ArrowUp") lbSwitch(-1);
  else if (/^[1-4]$/.test(e.key)) lbRestyle(STYLES[+e.key-1].id);
  else return;
  e.preventDefault();
});

/* ---------------- 声音：全部由浏览器现场合成，不用任何音乐文件 ---------------- */
const SND = { on:THEME.soundOn, active:false, ac:null, amb:null, cur:-2, step:0, last:0, tone:-1, ks:new Map() };
const SCALE = THEME.scale, NS = SCALE.length;
const hz = (deg, oct=0, base=THEME.base) => 440*Math.pow(2, (base + 12*(oct + Math.floor(deg/NS)) + SCALE[mod(deg,NS)] - 69)/12);
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const A = () => SND.ac;
const sndReady = () => SND.on && SND.ac?.state==="running";

function sndInit(){
  const ac = SND.ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 8;   // 总线限幅，防爆音
  SND.out = ac.createGain(); SND.out.gain.value = 0; SND.out.connect(comp).connect(ac.destination);
  // 混响：一段指数衰减的噪声当冲激响应
  // 短混响：1.2s、快衰减，12ms 预延迟，让四四拍的鼓点干净不糊
  const len = ac.sampleRate*1.2, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c=0; c<2; c++){ const b = ir.getChannelData(c); for (let i=0; i<len; i++) b[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
  const verb = ac.createConvolver(); verb.buffer = ir; verb.connect(SND.out);
  const wetTone = ac.createBiquadFilter(); wetTone.type="lowpass"; wetTone.frequency.value=3800; wetTone.Q.value=.4;
  const pre = ac.createDelay(.2); pre.delayTime.value=.012;
  wetTone.connect(pre).connect(verb);
  SND.wet = ac.createGain(); SND.wet.gain.value = .2; SND.wet.connect(wetTone);
  // fx 总线：悬停音、转场；lp 总线：章节环境声，横向滚动时改它的亮度
  SND.fx = ac.createGain(); SND.fx.connect(SND.out); SND.fx.connect(SND.wet);
  const hl = ac.createBiquadFilter(); hl.type = "lowpass"; hl.frequency.value = 3200; hl.Q.value = .5;   // 悬停音再过一道柔和低通，去掉刺耳的高频
  SND.hov = ac.createGain(); SND.hov.connect(hl).connect(SND.fx);
  SND.lp = ac.createBiquadFilter(); SND.lp.type = "lowpass"; SND.lp.frequency.value = 2900; SND.lp.Q.value = .5;
  SND.lp.connect(SND.out); SND.lp.connect(SND.wet);
  SND.noise = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
  SND.crackle = ac.createBuffer(1, ac.sampleRate*3, ac.sampleRate);
  const nz = SND.noise.getChannelData(0), cr = SND.crackle.getChannelData(0);
  for (let i=0; i<nz.length; i++) nz[i] = Math.random()*2-1;
  for (let i=0; i<cr.length; i++) cr[i] = Math.random() < .0007 ? (Math.random()*2-1)*.8 : (Math.random()*2-1)*.004;
  setInterval(sndTick, 60);
}
function env(g, t, a, peak, dec){ g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t+a); g.gain.exponentialRampToValueAtTime(.0001, t+a+dec); }
const V = {
  swoosh(t, dest, v=.12, dur=.55){             // 页面转场的一阵风
    const ac = A(), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = SND.noise; fl.type = "bandpass"; fl.Q.value = 1.2;
    fl.frequency.setValueAtTime(300, t); fl.frequency.exponentialRampToValueAtTime(3200, t+dur*.6); fl.frequency.exponentialRampToValueAtTime(600, t+dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+dur*.45); g.gain.linearRampToValueAtTime(0, t+dur);
    s.connect(fl).connect(g).connect(dest); s.start(t); s.stop(t+dur+.05);
  },
};
function loopNoise(dest, buf, type, freq, q, gain){
  const ac = A(), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = buf; s.loop = true; fl.type = type; fl.frequency.value = freq; fl.Q.value = q; g.gain.value = gain;
  s.connect(fl).connect(g).connect(dest); s.start(); return { s, fl, g };
}
function lfo(param, rate, depth){ const ac = A(), o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = rate; g.gain.value = depth; o.connect(g).connect(param); o.start(); return o; }
function drone(dest, f, type, gain){ const ac = A(), o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.value = gain; o.connect(g).connect(dest); o.start(); return o; }
// 环境效果（转场、上扫、房间气声）＋ 本站的乐器族：欧美动感 house / EDM。
// 四四拍底鼓、拍手、hi-hat、sub bass、和弦 stab 与明亮 lead 全部由振荡器和噪声现场合成，零音频文件。
Object.assign(V, {
  riser(t, dest, v=.04, dur=.8, f0=200, f1=4000, root=146.8){
    const ac = A(), fl = ac.createBiquadFilter(), g = ac.createGain();
    fl.type = "lowpass"; fl.Q.value = 9;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+dur*.85); g.gain.linearRampToValueAtTime(0, t+dur+.06);
    fl.connect(g).connect(dest);
    [[1,0],[1,9],[1.5,-6],[.5,4]].forEach(([k,dt])=>{ const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = root*k; o.detune.value = dt; o.connect(fl); o.start(t); o.stop(t+dur+.1); });
  },
  wind(t, dest, v=.08, dur=1, f0=300, f1=2400, q=1.2, type="bandpass"){
    const ac = A(), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = SND.noise; s.loop = true; fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t+dur*.55); fl.frequency.exponentialRampToValueAtTime(f0, t+dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+dur*.45); g.gain.linearRampToValueAtTime(0, t+dur);
    s.connect(fl).connect(g).connect(dest); s.start(t, Math.random()); s.stop(t+dur+.05);
  },
  vinyl(t, dest, v=.6, dur=1){
    const ac = A(), s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = SND.crackle; s.loop = true; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.08); g.gain.linearRampToValueAtTime(0, t+dur);
    s.connect(g).connect(dest); s.start(t, Math.random()*2); s.stop(t+dur+.05);
  },
  air(t, dest, v=.03, dur=1.2, f0=500, f1=1500){
    const ac = A(), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = SND.noise; s.loop = true; fl.type = "bandpass"; fl.Q.value = .5;
    fl.frequency.setValueAtTime(f0, t);
    fl.frequency.exponentialRampToValueAtTime(f1, t+dur*.45);
    fl.frequency.exponentialRampToValueAtTime(f0*.8, t+dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+dur*.32); g.gain.linearRampToValueAtTime(0, t+dur+.08);
    s.connect(fl).connect(g).connect(dest); s.start(t, Math.random()); s.stop(t+dur+.1);
  },
  /* —— 节奏组 —— */
  kick(t, dest, v=.16, o={}){
    const ac = A(), g = ac.createGain(), osc = ac.createOscillator();
    const f0 = o.f0 ?? 150, f1 = o.f1 ?? 48, dur = o.dur ?? .3;
    osc.type = "sine";
    osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(f1, t+.12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.003); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    osc.connect(g).connect(dest); osc.start(t); osc.stop(t+dur+.05);
    const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), cg = ac.createGain();
    s.buffer = SND.noise; hp.type = "highpass"; hp.frequency.value = 2200;
    cg.gain.setValueAtTime(v*.26, t); cg.gain.exponentialRampToValueAtTime(.0001, t+.022);
    s.connect(hp).connect(cg).connect(dest); s.start(t, Math.random()); s.stop(t+.04);
  },
  clap(t, dest, v=.08){
    const ac = A();
    [0, .011, .023].forEach((dt,i)=>{
      const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = SND.noise; fl.type = "bandpass"; fl.frequency.value = 1500; fl.Q.value = 1.1;
      env(g, t+dt, .001, v*(1-i*.18), i===2 ? .16 : .018);
      s.connect(fl).connect(g).connect(dest); s.start(t+dt, Math.random()); s.stop(t+dt+.24);
    });
  },
  hat(t, dest, v=.035, open=false){
    const ac = A(), s = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain(), dur = open ? .18 : .045;
    s.buffer = SND.noise; hp.type = "highpass"; hp.frequency.value = 7200;
    env(g, t, .001, v, dur);
    s.connect(hp).connect(g).connect(dest); s.start(t, Math.random()); s.stop(t+dur+.05);
  },
  sub(f, t, dest, v=.09, dur=.4){
    const ac = A(), fl = ac.createBiquadFilter(), g = ac.createGain();
    fl.type = "lowpass"; fl.frequency.value = Math.min(420, Math.max(180, f*2)); fl.Q.value = .6;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    fl.connect(g).connect(dest);
    [[1,1],[2,.12]].forEach(([k,a])=>{ const o = ac.createOscillator(), og = ac.createGain(); o.type = "sine"; o.frequency.value = f*k; og.gain.value = a; o.connect(og).connect(fl); o.start(t); o.stop(t+dur+.05); });
  },
  bass(f, t, dest, v=.08, dur=.22, o={}){
    const ac = A(), fl = ac.createBiquadFilter(), g = ac.createGain();
    fl.type = "lowpass"; fl.Q.value = 5;
    fl.frequency.setValueAtTime(Math.min(2600, f*7), t);
    fl.frequency.exponentialRampToValueAtTime(Math.max(120, f*1.3), t+dur);
    env(g, t, .004, v, dur); fl.connect(g).connect(dest);
    [0,8].forEach(dt=>{ const osc = ac.createOscillator(); osc.type = "sawtooth"; osc.frequency.value = f; osc.detune.value = dt; osc.connect(fl); osc.start(t); osc.stop(t+dur+.05); });
    const s = ac.createOscillator(), sg = ac.createGain(); s.type = "sine"; s.frequency.value = f/2; sg.gain.value = .5;
    s.connect(sg).connect(fl); s.start(t); s.stop(t+dur+.05);
  },
  stab(freqs, t, dest, v=.07, dur=.35, o={}){
    const ac = A(), fl = ac.createBiquadFilter(), g = ac.createGain();
    fl.type = "lowpass"; fl.Q.value = 3.2;
    fl.frequency.setValueAtTime(o.open ? 5200 : 3000, t);
    fl.frequency.exponentialRampToValueAtTime(900, t+dur);
    env(g, t, .006, v, dur); fl.connect(g).connect(dest);
    freqs.forEach(f=>[-7,7].forEach(dt=>{
      const osc = ac.createOscillator(), og = ac.createGain();
      osc.type = "sawtooth"; osc.frequency.value = f; osc.detune.value = dt;
      og.gain.value = 1/Math.sqrt(freqs.length*2); osc.connect(og).connect(fl);
      osc.start(t); osc.stop(t+dur+.06);
    }));
  },
  lead(f, t, dest, v=.06, dur=.3, o={}){
    const ac = A(), fl = ac.createBiquadFilter(), g = ac.createGain();
    fl.type = "lowpass"; fl.Q.value = 2.4; fl.frequency.value = o.bright ? 6200 : 4200;
    env(g, t, .005, v, dur); fl.connect(g).connect(dest);
    [0,9].forEach(dt=>{
      const osc = ac.createOscillator(), og = ac.createGain();
      osc.type = dt ? "square" : "sawtooth";
      osc.frequency.setValueAtTime(f*.94, t); osc.frequency.exponentialRampToValueAtTime(f, t+.055);
      osc.detune.value = dt; og.gain.value = dt ? .22 : .8;
      osc.connect(og).connect(fl); osc.start(t); osc.stop(t+dur+.06);
    });
  },
  sweep(t, dest, v=.05, dur=.9, f0=400, f1=6000){
    const ac = A(), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = SND.noise; s.loop = true; fl.type = "bandpass"; fl.Q.value = .8;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t+dur*.85);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+dur*.7); g.gain.linearRampToValueAtTime(0, t+dur+.05);
    s.connect(fl).connect(g).connect(dest); s.start(t, Math.random()); s.stop(t+dur+.1);
  },
  impact(t, dest, v=.12){
    V.kick(t, dest, v*.9, {f0:180, f1:42, dur:.5});
    const ac = A(), s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = SND.noise; fl.type = "lowpass"; fl.frequency.value = 1800;
    env(g, t, .002, v*.5, .22); s.connect(fl).connect(g).connect(dest); s.start(t, Math.random()); s.stop(t+.3);
  },
});
const arp = (t, degs, gap, fn) => degs.forEach((d,k)=>fn(d, t + k*gap));

/* ===== 声音：风格区 ===== 每章一套 house / EDM 节拍与环境，数组顺序对应 CHAPTERS。配方见 skills/photo-album/references/sound.md
   hz(音级, 八度, 基准) 按 THEME.scale 取音；V.kick / V.hat / V.clap / V.sub / V.bass / V.stab / V.lead 是上面的乐器族。
   四章按一次训练由重到轻：124 / 126 / 128 / 100 BPM，底鼓、反拍 hi-hat、sub bass 与和弦 stab 的密度依次变化。 */
// 首页：照片环每走一格弹 melody 里的下一个音（step）；风格台切换时响一声（chime）
const RING_SND = {
  melody:[0,2,4,6,4,2,0,3,5,7,5,3],
  step:(f,t,d,v)=>V.lead(f, t, d, v*.5, .16, {bright:true}),
  chime:(f,t,d,v)=>V.stab([f, f*Math.pow(2,3/12), f*Math.pow(2,7/12)], t, d, v*.45, .4, {open:true}),
};
// 大图里每章一套声音：open 聚拢 / step 显影每一级 / done 成像 / look 放大镜 / swap 切换 / close 关闭
const LB_SND = [
  { // 硬拉：低频冲击，成像时一记重落
    open:t=>{ V.sweep(t, SND.fx, .055, 1.0, 280, 5000); V.sub(hz(0,-1), t+.1, SND.fx, .08, .9); },
    step:(t,j)=>V.hat(t, SND.fx, .04+.004*j, false),
    done:t=>{ V.impact(t, SND.fx, .13); V.stab([0,2,4].map(d=>hz(d,0)), t+.07, SND.fx, .06, .5, {open:true}); },
    look:(t,d,v)=>V.lead(hz(d,1), t, SND.fx, .045*v, .14, {bright:true}),
    swap:t=>V.bass(hz(0,-1), t, SND.fx, .09, .2),
    close:t=>arp(t, [7,5,3,0], .11, (d,s)=>V.lead(hz(d,0), s, SND.fx, .055, .18)),
  },
  { // 臀腿：切分律动，显影时 hi-hat 逐级加密
    open:t=>{ V.riser(t, SND.fx, .045, .8, 200, 3800, hz(0,-1)); V.hat(t+.1, SND.fx, .035, true); },
    step:(t,j)=>{ V.hat(t, SND.fx, .035+.004*j, false); if (j%2) V.bass(hz(j,-1), t, SND.fx, .055, .16); },
    done:t=>{ V.clap(t, SND.fx, .07); V.stab([0,2,4].map(d=>hz(d,0)), t+.05, SND.fx, .055, .7, {open:true}); },
    look:(t,d,v)=>V.bass(hz(d,-1), t, SND.fx, .05*v, .14),
    swap:t=>V.clap(t, SND.fx, .055),
    close:t=>arp(t, [7,5,3,0], .1, (d,s)=>V.hat(s, SND.fx, .045, false)),
  },
  { // 肩部：明亮 lead 上行，最轻快
    open:t=>arp(t, [0,3,5,7], .075, (d,s)=>V.lead(hz(d,1), s, SND.fx, .045, .2, {bright:true})),
    step:(t,j)=>V.lead(hz(j,1), t, SND.fx, .04, .14, {bright:true}),
    done:t=>{ V.stab([0,2,4,7].map(d=>hz(d,0)), t, SND.fx, .06, .6, {open:true}); V.lead(hz(7,1), t+.06, SND.fx, .05, .3, {bright:true}); },
    look:(t,d,v)=>V.lead(hz(d,1), t, SND.fx, .04*v, .12, {bright:true}),
    swap:t=>V.lead(hz(4,1), t, SND.fx, .055, .16, {bright:true}),
    close:t=>arp(t, [7,5,3,0], .09, (d,s)=>V.lead(hz(d,1), s, SND.fx, .045, .16, {bright:true})),
  },
  { // 瑜伽：长气息与留白，收得最慢
    open:t=>{ V.air(t, SND.fx, .04, 1.6, 380, 1050); V.stab([0,2,4].map(d=>hz(d,0)), t+.2, SND.fx, .045, 1.4, {open:true}); },
    step:(t,j)=>V.hat(t, SND.fx, .012+.002*j, true),
    done:t=>V.stab([0,2,4,6].map(d=>hz(d,0)), t, SND.fx, .05, 1.8, {open:true}),
    look:(t,d,v)=>V.lead(hz(d,0), t, SND.fx, .025*v, .4),
    swap:t=>V.air(t, SND.fx, .025, .6, 500, 1300),
    close:t=>arp(t, [4,2,0], .22, (d,s)=>V.stab([d].map(x=>hz(x,0)), s, SND.fx, .035, 1.0, {open:true})),
  },
];
// 悬停音色：四章分别用 sub / bass / lead / stab，越往后越轻
const VOICE = [
  (f,t,d)=>V.sub(f/2, t, d, .07, .22),
  (f,t,d)=>V.bass(f/2, t, d, .065, .16),
  (f,t,d)=>V.lead(f, t, d, .05, .16, {bright:true}),
  (f,t,d)=>V.stab([f, f*Math.pow(2,3/12)], t, d, .04, .45, {open:true}),
];
// 每章的环境声：tick 一次排满一个小节（4 拍），返回下一小节的起点，节拍不受 60ms 调度抖动影响
const SCENES = [
  b=>{ const n = loopNoise(b, SND.noise, "lowpass", 380, .5, .022); const beat = 60/124; let bar = 0;       // 硬拉 124 BPM：四四拍重底鼓 + 反拍开镲
       return { nodes:[n.s, lfo(n.g.gain,.08,.008)], tick:t=>{
         for (let k=0;k<4;k++){
           const s = t + k*beat;
           V.kick(s, b, .17);
           V.hat(s, b, .02, false);
           V.hat(s + beat*.5, b, .038, true);
         }
         V.sub(hz(0,-1), t, b, .085, beat*.9);
         if (bar%2===0) V.stab([0,2,4].map(d=>hz(d,0)), t + beat*2, b, .05, beat*1.4);
         bar++; return t + 4*beat;
       } }; },
  b=>{ const n = loopNoise(b, SND.noise, "bandpass", 900, .7, .02); const beat = 60/126; let bar = 0;       // 臀腿 126 BPM：16 分 hi-hat + 切分贝斯
       const line = [0,0,3,0,5,3,0,2];
       return { nodes:[n.s, lfo(n.g.gain,.1,.007)], tick:t=>{
         for (let k=0;k<4;k++){
           const s = t + k*beat;
           V.kick(s, b, .155);
           for (let h=0;h<4;h++) V.hat(s + h*beat/4, b, h%2 ? .015 : .025, false);
           V.bass(hz(line[(bar*4+k)%8],-1), s + beat*.5, b, .065, beat*.28);
         }
         if (bar%2===1){ V.clap(t + beat, b, .055); V.clap(t + beat*3, b, .055); }
         V.stab([0,2,4].map(d=>hz(d,0)), t + beat*2.5, b, .045, beat*.8, {open:true});
         V.sub(hz(0,-1), t, b, .07, beat*.9);
         bar++; return t + 4*beat;
       } }; },
  b=>{ const n = loopNoise(b, SND.noise, "bandpass", 1400, .6, .016); const beat = 60/128; let bar = 0;     // 肩部 128 BPM：2/4 拍拍手 + lead 短句
       const seq = [0,3,5,7,5,3,2,4];
       return { nodes:[n.s, lfo(n.g.gain,.12,.006)], tick:t=>{
         for (let k=0;k<4;k++){
           const s = t + k*beat;
           V.kick(s, b, .14);
           for (let h=0;h<4;h++) V.hat(s + h*beat/4, b, h===2 ? .026 : .016, false);
           if (k===1 || k===3) V.clap(s, b, .055);
           V.bass(hz(seq[(bar*4+k)%8],-1), s + beat*.25, b, .055, beat*.22);
         }
         arp(t + beat*.5, [0,3,5,7], beat*.5, (d,s)=>V.lead(hz(d,1), s, b, .04, beat*.35, {bright:true}));
         if (bar%2===0) V.stab([0,2,4].map(d=>hz(d,0)), t + beat*2, b, .04, beat*.7, {open:true});
         bar++; return t + 4*beat;
       } }; },
  b=>{ const n = loopNoise(b, SND.noise, "lowpass", 600, .4, .018); const beat = 60/100; let bar = 0;        // 瑜伽 100 BPM：soft kick 每两拍、长和弦、气息与留白
       return { nodes:[n.s, lfo(n.g.gain,.06,.006)], tick:t=>{
         V.kick(t, b, .075, {f0:110, f1:44, dur:.42});
         V.kick(t + beat*2, b, .062, {f0:110, f1:44, dur:.42});
         V.hat(t + beat, b, .014, true); V.hat(t + beat*3, b, .014, true);
         V.sub(hz(0,-1), t, b, .06, beat*2.2);
         V.stab([0,2,4,6].map(d=>hz(d,0)), t + .3, b, .04, beat*3.2, {open:true});
         if (bar%2===0) V.air(t + .6, b, .02, 2.4, 420, 1100);
         bar++; return t + 4*beat;
       } }; },
];
/* ===== 声音：风格区结束 ===== */


function lbSnd(name, ...a){ if (!sndReady()) return; const f = LB_SND[LB.ci]?.[name]; if (f) f(A().currentTime + .01, ...a); }
// 大图打开时，章节环境声压低、变闷，让位给大图的声音；关掉后恢复
function sndDuck(on){
  if (LB.ducked===on) return; LB.ducked = on;
  if (!sndReady()) return;
  const t = A().currentTime;
  if (SND.amb) SND.amb.g.gain.setTargetAtTime((on ? .3 : 1)*THEME.presence, t, .35);
  if (on) SND.lp.frequency.setTargetAtTime(750, t, .35); else SND.tone = -1;
}

function stopAmb(a, fade){
  if (!a) return; const t = A().currentTime;
  a.g.gain.cancelScheduledValues(t); a.g.gain.setTargetAtTime(0, t, fade);
  setTimeout(()=>{ a.nodes.forEach(n=>{ try { n.stop(); } catch(e){} }); a.g.disconnect(); }, fade*5000);
}
// 首页不放环境声（让悬停音更清楚），进章节淡入那一章的声音
function sndScene(){
  if (!sndReady()) return;
  const want = route.view==="chapter" ? route.ci : -1;
  if (want===SND.cur) return;
  SND.cur = want; stopAmb(SND.amb, .35); SND.amb = null;
  if (want < 0) return;
  const ac = A(), g = ac.createGain(); g.gain.value = 0; g.connect(SND.lp); g.gain.setTargetAtTime(THEME.presence, ac.currentTime+.2, .6);
  const sc = SCENES[want](g);
  SND.amb = { g, nodes:sc.nodes, tick:sc.tick, next:ac.currentTime + .3 };
}
function sndTick(){
  const a = SND.amb; if (!a || !sndReady()) return;
  const now = A().currentTime;
  if (a.next < now) a.next = now + .05;                 // 切走标签页回来时不补放积压的音
  while (a.next < now + .25) a.next = a.tick(a.next);
}
function sndHover(ci, pi){
  if (!sndReady()) return; const t = A().currentTime;
  if (t - SND.last < .09) return; SND.last = t;                     // 手指连续划过时不堆音
  const L = photoLum(CHAPTERS[ci].photos[pi].src);
  VOICE[ci](hz(L===null ? mod(ci*2 + pi*3, 8) : Math.round(L*7)), t, SND.hov);   // 音高由照片亮度决定：暗的低、亮的高
}
// 照片环每走一格响一个音，滚动起来就是一段旋律；滚得越快越响
function sndStep(dir, speed){
  if (!sndReady()) return;
  const MEL = RING_SND.melody;
  SND.step += dir; RING_SND.step(hz(MEL[mod(SND.step, MEL.length)] + NS), A().currentTime, SND.fx, Math.min(.28, .08 + speed*.25));
}
function sndSwoosh(){ if (sndReady()) V.swoosh(A().currentTime, SND.fx); }
function sndChime(i){ if (sndReady()) RING_SND.chime(hz(i*2 + 2, 1), A().currentTime, SND.fx, .1); }
function sndTone(k){ if (!sndReady() || Math.abs(k - SND.tone) < .01) return; SND.tone = k; SND.lp.frequency.setTargetAtTime(800 + k*3000, A().currentTime, .15); }

const sndBtn = $("#snd");
sndBtn.addEventListener("click", ()=>setSound(!SND.on));
function syncSoundUI(){
  sndBtn.setAttribute("aria-pressed", String(SND.on));
  sndBtn.dataset.playing = String(!!sndReady());
  sndBtn.setAttribute("aria-label", SND.on ? "声音已开启，点击关闭" : "声音已关闭，点击开启");
  sndBtn.title = SND.on ? (sndReady() ? "声音已开启" : "声音已开启，首次轻点后开始播放") : "声音已关闭";
}
function activateSound(){
  if (!sndReady() || SND.active) return;
  SND.active = true;
  const ac = A();
  SND.out.gain.cancelScheduledValues(ac.currentTime); SND.out.gain.setTargetAtTime(.84, ac.currentTime, .15);
  SND.cur = -2; sndScene();
  if (LB.open){ LB.ducked = false; sndDuck(true); }
  V.stab([0,2,4].map(d=>hz(d,0)), ac.currentTime + .05, SND.fx, .05, .55, {open:true});
  syncSoundUI();
}
function resumeSound(){
  if (!SND.on) return;
  try {
    if (!SND.ac){
      sndInit();
      A().addEventListener("statechange", ()=>{
        if (A().state==="running") activateSound();
        else SND.active = false;
        syncSoundUI();
      });
    }
    if (A().state==="running") activateSound();
    else A().resume().then(activateSound).catch(()=>syncSoundUI());
  } catch(e){ SND.on = false; syncSoundUI(); }
}
// 默认开启。若浏览器暂缓自动播放，在首次有效手势中恢复；手动关掉后不会再次自动开启。
// touchend / pointerup 也监听，兼容必须在触摸结束后才允许播放的移动浏览器。
const sndFirst = e=>{
  if (SND.on && !sndReady() && !(e.target instanceof Node && sndBtn.contains(e.target))) resumeSound();
};
["pointerdown","pointerup","touchend","keydown"].forEach(n=>addEventListener(n, sndFirst, { capture:true, passive:true }));
function setSound(on){
  SND.on = on; syncSoundUI();
  if (on) resumeSound();
  else if (SND.ac){
    SND.active = false;
    const ac = A(); SND.out.gain.setTargetAtTime(0, ac.currentTime, .12);
    setTimeout(()=>{ if (SND.on) return; stopAmb(SND.amb, .01); SND.amb = null; SND.cur = -2; ac.suspend().catch(()=>{}); }, 600);
  }
}

/* ---------------- 路由与转场 ---------------- */
const route = { view:"home", key:"" };
const curtain = $("#curtain");
function parse(){
  const path = location.hash || "#/";
  if (/^#\/about\/?$/.test(path)) return { view:"about", key:"about", photo:-1, path };
  const m = location.hash.match(/^#\/ch\/(\d+)(?:\/(\d+))?(\/view)?/);
  if (m){
    const ci = Math.min(CHAPTERS.length, Math.max(1, +m[1])) - 1, focus = +(m[2]||0), n = CHAPTERS[ci].photos.length;
    return { view:"chapter", ci, focus, photo: m[3] && focus ? Math.min(n, focus) - 1 : -1, key:`ch${ci}`, path };   // /view：打开这一张的大图
  }
  return { view:"home", key:"home", photo:-1, path };
}
function show(r){
  const wasAbout = route.view==="about";
  if (r.view==="about" && !wasAbout && route.key){
    authorReturn = route.path || "#/"; $("#authorBack").href = authorReturn;
  }
  if (LB.open) lbReset();
  if (r.view!=="home"){
    clearTouchPreview(false); clearTimeout(P.timer); ring.hover = false;
    P.mx = P.my = -1e4;
  }
  $("#home").hidden = r.view!=="home";
  $("#chapter").hidden = r.view!=="chapter";
  $("#about").hidden = r.view!=="about";
  if (r.view==="home") $("#home").scrollTop = 0;   // 回首页时从上层展示区重新开始
  document.querySelectorAll("[data-nav]").forEach(a=>a.setAttribute("aria-current", String(a.dataset.nav===(r.view==="chapter"?"ch":r.view))));
  if (r.view==="chapter") buildChapter(r.ci, r.focus);
  else if (r.view==="home" && P.key){ clearTimeout(P.timer); setShape(0, null, false); setCaption(-1); }   // 回首页时粒子字恢复成首页大字
  Object.assign(route, r);
  sndScene();
  if (r.view==="about"){
    $("#about").scrollTop = 0; $("#authorStatus").textContent = "";
    $("#authorName").focus({ preventScroll:true });
  } else if (wasAbout){
    (authorTrigger?.getClientRects().length ? authorTrigger : $("#logo")).focus({ preventScroll:true });
  }
}
let busy = false, goTok = 0;
async function go(){
  const r = parse(), tok = ++goTok;
  if (r.key===route.key && r.view==="home") return;
  if (r.key===route.key && !busy){ Object.assign(route,r); if (r.view==="chapter") lbSync(r); return; }       // 同一章里只是开关大图，不走幕布转场
  if (reduce || busy){ show(r); if (r.photo >= 0) lbOpen(r.ci, r.photo, false); return; }
  busy = true; sndSwoosh();
  curtain.classList.add("active");
  curtain.querySelector("b").textContent = r.view==="chapter" ? CHAPTERS[r.ci].en : r.view==="about" ? "About" : HOME.word;
  const opt = { duration:520, easing:EASE, fill:"forwards" };
  await curtain.animate([{transform:"translateY(100%)"},{transform:"translateY(0)"}], opt).finished;
  if (tok===goTok) show(r);                                  // 转场途中网址又变了：以最新的为准，不要把它重置掉
  await new Promise(res=>setTimeout(res,120));
  await curtain.animate([{transform:"translateY(0)"},{transform:"translateY(-100%)"}], opt).finished;
  curtain.getAnimations().forEach(a=>a.cancel());
  curtain.classList.remove("active");
  busy = false;
  if (tok===goTok && r.photo >= 0) lbOpen(r.ci, r.photo, false);           // 从别处直接跳到某张大图：幕布拉开后再显影
}
addEventListener("hashchange", go);

/* ---------------- 水面：静水 + 指针涟漪 ----------------
   去掉了所有自发的多方向行波、高度场脊线、交叉波与 SVG 噪声位移：没有人碰水面时
   canvas 完全透明，倒影就是一面压暗的镜子。只有鼠标划过倒影，命中处才泛起几圈
   横向拉长（1.7:1）的小椭圆涟漪：亮环在前、暗环紧随，中心一点极淡的隆起高光，
   约 1 秒消散。涟漪散尽后立刻清空画布，静止时零绘制开销。 */
const WATER = { lastX:-1e4, lastY:-1e4, lastT:0 };

function drawWater(t){
  const layers = ring.waters;
  if (!layers.length || reduce) return;
  for (const L of layers){
    if (L.ripples.length) L.ripples = L.ripples.filter(r=>t-r.t0 < 1050);
    if (!L.ripples.length){
      if (L.dirty){ L.ctx.clearRect(0,0,L.w,L.h); L.dirty=false; }   // 最后一圈散尽后擦干净
      continue;
    }
    const { ctx, w, h, ds } = L;
    ctx.clearRect(0,0,w,h); L.dirty = true;
    for (const r of L.ripples){
      const age=Math.max(0,(t-r.t0)/1000), life=Math.max(0,1-age/1.05);
      const a=.32*life*life*r.amp;
      if (a<.006) continue;
      const cx=r.x/ds, cy=r.y/ds;
      // 中心一点极淡的隆起：像指尖轻轻按了一下水面。先压扁成 1.7:1 再画径向渐变
      ctx.save(); ctx.translate(cx,cy); ctx.scale(1,1/1.7);
      const gr=ctx.createRadialGradient(0,0,0,0,0,30/ds);
      gr.addColorStop(0,`rgba(226,248,250,${(a*.30).toFixed(3)})`);
      gr.addColorStop(.55,"rgba(226,248,250,0)");
      gr.addColorStop(.80,`rgba(8,26,32,${(a*.13).toFixed(3)})`);
      gr.addColorStop(1,"rgba(8,26,32,0)");
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(0,0,30/ds,0,Math.PI*2); ctx.fill();
      ctx.restore();
      // 三道向外散开的波锋：亮环在前、暗环紧随，时间越久越淡
      for (let k=0;k<3;k++){
        const rad=age*66-k*9;
        if (rad<=2) continue;
        const rx=rad/ds, ry=rad/(1.7*ds), fade=a*(1-k*.26);
        ctx.lineWidth=k===0?1.1:.8;
        ctx.strokeStyle=`rgba(230,250,252,${fade.toFixed(3)})`;
        ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
        ctx.strokeStyle=`rgba(8,26,32,${(fade*.55).toFixed(3)})`;
        ctx.beginPath(); ctx.ellipse(cx,cy+1.6/ds,rx+3/ds,ry+1.8/ds,0,0,Math.PI*2); ctx.stroke();
      }
    }
  }
}

/* 鼠标划过静水 → 命中处泛起一圈小涟漪。监听挂在 window、canvas 保持 pointer-events:none，
   所以照片环、点阵字、手风琴的交互一个都不受影响。移动太密时按距离/时间节流。 */
addEventListener("pointermove", e=>{
  if (reduce || route.view!=="home" || e.pointerType==="touch") return;
  const now=performance.now();
  if (now-WATER.lastT < 110 &&
      Math.abs(e.clientX-WATER.lastX)+Math.abs(e.clientY-WATER.lastY) < 24) return;
  WATER.lastX=e.clientX; WATER.lastY=e.clientY; WATER.lastT=now;
  for (const L of ring.waters){
    const r=L.cv.getBoundingClientRect();
    if (e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom) continue;
    L.ripples.push({ x:e.clientX-r.left, y:e.clientY-r.top, t0:now, amp:.8+Math.random()*.35 });
    if (L.ripples.length>4) L.ripples.shift();
    break;
  }
}, { passive:true });

/* ---------------- 水面倒影：滚轮冲量 → 倾角 ----------------
   水面本身是静的：没有相位、没有噪声位移、没有自发波纹。只有滚轮带来的整体倾斜还在，
   停下后弹簧慢慢回正。鼠标涟漪由上面的 canvas 单独负责。 */
function reflectTick(){
  if (reduce) return;
  REFL.target *= .955;                                   // 停止滚动后约 1 秒慢慢回正
  REFL.tilt   += (REFL.target - REFL.tilt)*.075;         // 弹簧追随，不跟着滚轮一格一格跳
  REFL.tick = (REFL.tick + 1) & 1;
  if (REFL.tick) return;                                 // 倾角每 2 帧写一次就够顺
  frame.style.setProperty("--refl-tilt", REFL.tilt.toFixed(2)+"deg");
}

/* ---------------- 主循环 ---------------- */
function loop(t){
  if (route.view==="home"){
    // 没人操作 2 秒后，照片环自己慢慢转；鼠标停在照片上时暂停
    if (!reduce && !ring.hover && !ring.preview && !homeTouch && t - ring.lastInput > 2000) ring.tu += THEME.motion.drift;
    ring.u += (ring.tu - ring.u)*THEME.motion.follow;
    const cell = Math.floor(ring.u);
    if (cell!==ring.cell){ if (ring.cell!==undefined) sndStep(Math.sign(cell - ring.cell), Math.abs(ring.tu - ring.u)); ring.cell = cell; }
    renderRing(t);
    reflectTick();
    drawWater(t);
    stepDots();
  } else if (route.view==="chapter"){
    renderChapter();
  }
  requestAnimationFrame(loop);
}

let rt;
addEventListener("resize", ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ layoutRing(); sampleDots(false); if (route.view==="chapter") measureChapter(); if (LB.open) lbResize(); }, 120); });
function lbResize(){ lbLayout(); lpHide(); if (LB.phase==="shown") lbDrawDev(1); }

(async function init(){
  document.title = THEME.title;
  $("#logo").innerHTML = `${THEME.logo[0]}<span class="box">${THEME.logo[1]}</span>`;
  initAuthor();
  buildHero();
  // 上层展示区可滚动：点左上角 logo 回到顶部标题；照片环区域内的滑动仍只转环
  $("#logo").addEventListener("click", ()=>{ if (route.view==="home") $("#home").scrollTo({top:0,behavior:"smooth"}); });
  updateTouchGuide(); syncSoundUI();
  setCaption(-1); cv.setAttribute("aria-label", HOME.word);
  layoutRing();
  sampleDots(true);
  const r = parse(); show(r);
  setSound(THEME.soundOn);
  requestAnimationFrame(loop);
  if (r.photo >= 0) requestAnimationFrame(()=>requestAnimationFrame(()=>lbOpen(r.ci, r.photo, false)));
  // 先开放交互；字体加载完成后按当前预览重采样，不重置用户已经选中的照片。
  try { await document.fonts.load(`${THEME.font.weight} 100px "${THEME.font.family}"`); sampleDots(false); } catch(e){}
})();
</script>
